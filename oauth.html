<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인 처리 중…</title>
<!-- 구글 로그인 팝업이 **돌아오는 자리**. 사람이 보는 화면이 아니다 — 0.2초 뜨고 닫힌다.
     왜 필요한가: One Tap(google.accounts.id.prompt)은 브라우저에 구글 세션이 없으면 아무것도 안 뜨고
     조용히 실패한다(FedCM 이 되면서 더 심해졌다 — 「Provider's accounts list is empty」).
     그래서 계정 고르는 창을 **직접 띄우고**, 구글이 여기로 돌려보낸 id_token 을 원래 창에 넘긴다.
     토큰은 주소의 # 뒤에 온다 — 서버 기록에 남지 않는 자리다. -->
<style>body{margin:0;background:#060a10;color:#8aa2b4;font:13px/1.6 -apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;display:grid;place-items:center;height:100vh}</style>
</head>
<body>
<p id="msg">로그인 확인 중…</p>
<script>
(function () {
  var p = new URLSearchParams(location.hash.slice(1));
  var token = p.get('id_token'), error = p.get('error');
  var state = p.get('state') || '';
  try {
    if (window.opener) {
      window.opener.postMessage({ source: 'patient-zero-oauth', token: token, error: error, state: state }, location.origin);
      window.close();
      return;
    }
  } catch (e) {}
  // 팝업이 아니라 같은 창으로 돌아온 경우(모바일 사파리가 그렇게 한다) — 저장해 두고 게임으로 돌아간다
  try { sessionStorage.setItem('patient-zero-oauth', JSON.stringify({ token: token, error: error, state: state })); } catch (e) {}
  document.getElementById('msg').textContent = token ? '돌아가는 중…' : ('로그인하지 못했습니다 — ' + (error || '취소'));
  location.replace('./');
})();
</script>
</body>
</html>
